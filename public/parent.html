<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Parent Screener</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one calm card per screen, a slim section stepper on top, sticky footer nav. */
:root{
  --bg:#EEF3F4; --card:#FFFFFF; --ink:#1F3B57; --ink-soft:#4E6378; --muted:#7A8B9A;
  --line:#D5DFE4; --tint:#F3F7F8; --accent:#2D7D8A; --accent-ink:#FFFFFF; --pick:#E3F1F2;
  --sun:#E8A33D; --sun-soft:#FBF0DD; --proto:#FFF7E6; --proto-ink:#7A5310; --logo-bg:transparent; --logo-pad:0;
  --display:"Source Serif 4", Georgia, "Times New Roman", serif;
  --body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1A22; --card:#16242F; --ink:#E4EDF2; --ink-soft:#AFC0CC; --muted:#8094A3;
  --line:#2A3C49; --tint:#1B2D39; --accent:#5FB3BF; --accent-ink:#0B1A20; --pick:#1D3A42;
  --sun:#F0B85E; --sun-soft:#3A2E18; --proto:#2C2414; --proto-ink:#F1CD8A; --logo-bg:#ffffff; --logo-pad:3px 6px; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1A22; --card:#16242F; --ink:#E4EDF2; --ink-soft:#AFC0CC; --muted:#8094A3;
  --line:#2A3C49; --tint:#1B2D39; --accent:#5FB3BF; --accent-ink:#0B1A20; --pick:#1D3A42;
  --sun:#F0B85E; --sun-soft:#3A2E18; --proto:#2C2414; --proto-ink:#F1CD8A; --logo-bg:#ffffff; --logo-pad:3px 6px; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto}
.proto{margin:14px 0 0;background:var(--proto);color:var(--proto-ink);border-radius:10px;padding:8px 12px;font-size:13px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between}
.proto button{background:none;border:0;color:inherit;font:inherit;font-weight:600;text-decoration:underline;cursor:pointer;padding:0}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px 0 10px}
.brand{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px;color:var(--muted)}
.brand .logo{height:22px;width:auto;display:block;background:var(--logo-bg);padding:var(--logo-pad);border-radius:6px}
.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:10px}
.steps div{min-width:0}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .35s ease}
.steps span{display:block;font-size:11px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.02em}
.steps .on span{color:var(--ink);font-weight:600}
.left{font-size:12px;color:var(--muted);margin-top:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px 22px;margin-top:8px}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--accent);font-weight:700}
h1,h2{font-family:var(--display);font-weight:600;text-wrap:balance;margin:6px 0 8px;line-height:1.2}
h1{font-size:clamp(28px,6vw,36px)} h2{font-size:clamp(23px,5vw,28px)}
.lede{color:var(--ink-soft);margin:0 0 6px;max-width:60ch}
.stack{display:grid;gap:22px;margin-top:22px}
.q label.ql,.q .ql{display:block;font-weight:600;margin-bottom:3px}
.hint{font-size:13px;color:var(--muted);margin:0 0 8px}
.opt{color:var(--muted);font-weight:500;font-size:13px}
input[type=text],textarea{width:100%;font:inherit;color:var(--ink);background:var(--tint);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
textarea{min-height:84px;resize:vertical}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{font:inherit;font-size:15px;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:99px;padding:8px 14px;cursor:pointer;transition:background .15s,border-color .15s}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed=true]{background:var(--pick);border-color:var(--accent);font-weight:600}
.other{margin-top:8px}
.grows{display:grid;gap:8px;margin-top:6px}
.avail{display:grid;grid-template-columns:52px repeat(3,minmax(0,1fr));gap:6px;margin-top:8px;align-items:center}
.avail .d{font-weight:700;font-size:14px}
.avail .h{font-size:12px;color:var(--muted);text-align:center;font-weight:600}
.avail button{font:inherit;font-size:13px;color:var(--ink);background:var(--tint);border:1.5px solid transparent;border-radius:10px;padding:10px 4px;cursor:pointer;min-width:0}
.avail button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.avail button:hover{border-color:var(--accent)}
.grow{display:grid;grid-template-columns:minmax(0,1fr) 120px 36px;gap:8px;align-items:center}
.grow .x{font:inherit;font-size:18px;color:var(--muted);background:none;border:0;cursor:pointer;padding:6px}
.addrow{font:inherit;font-size:14px;font-weight:600;color:var(--accent);background:none;border:0;cursor:pointer;padding:6px 0;justify-self:start}
/* rating statements */
.stmt{border-top:1px solid var(--line);padding-top:16px}
.stmt:first-child{border-top:0;padding-top:0}
.stmt p{margin:0 0 10px}
.stmt .num{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.04em;margin-right:6px}
.scale{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.scale button{font:inherit;font-size:13px;line-height:1.2;color:var(--ink);background:var(--tint);border:1.5px solid transparent;border-radius:10px;padding:10px 4px;cursor:pointer;min-width:0}
.scale button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.scale button:hover{border-color:var(--accent)}
.count{font-size:13px;color:var(--muted);margin-top:18px}
.note{background:var(--sun-soft);border-radius:12px;padding:12px 14px;font-size:15px}
.pickrow{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px;cursor:pointer}
.pickrow[aria-pressed=true]{background:var(--pick);border-color:var(--accent)}
.badge{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700}
.pickrow[aria-pressed=true] .badge{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.picks{display:grid;gap:8px}
footer.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
footer .in{max-width:640px;margin:0 auto;display:flex;gap:10px;align-items:center}
.btn{font:inherit;font-weight:600;border-radius:12px;padding:12px 18px;cursor:pointer;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);margin-left:auto;min-width:140px}
.save{font-size:13px;color:var(--muted);background:none;border:0;cursor:pointer;font:inherit;text-decoration:underline}
.toast{font-size:13px;color:var(--accent);font-weight:600}
/* coach view */
.coach{margin-top:18px;border:1px dashed var(--line);border-radius:14px;padding:18px}
.rows{display:grid;gap:7px;margin-top:12px}
.row{display:grid;grid-template-columns:minmax(0,190px) 1fr 44px;gap:10px;align-items:center;font-size:14px}
.row .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .track{height:12px;background:var(--tint);border-radius:99px;overflow:hidden}
.row .track i{display:block;height:100%;background:var(--accent);border-radius:99px}
.row.lead .t{font-weight:700} .row.lead .track i{background:var(--sun)}
.row .v{font-variant-numeric:tabular-nums;text-align:right;color:var(--ink-soft)}
.flags{display:grid;gap:6px;margin-top:14px;font-size:14px}
.flags div{background:var(--tint);border-radius:8px;padding:8px 10px}
@media (max-width:460px){.row{grid-template-columns:1fr 44px;row-gap:3px}.row .t{grid-column:1/-1;white-space:normal}.card{padding:22px 16px}.scale button{font-size:12px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
const SECTIONS=[["A","About"],["B","Patterns"],["C","Strengths"],["D","School"],["E","Home"],["F","Final"]];
const SCALE=["Rarely","Sometimes","Often","Almost always"];
const PARTS=[
 [1,"Remembering and keeping track","Holding on to assignments, materials, and the small things that need to happen.",[
  ["1a","When a teacher announces a quiz or project in class and you find out later that it slipped through the cracks, their response is often, \u201cI didn\u2019t know we had that.\u201d"],
  ["1b","Does the homework but then leaves it at home, so it never gets turned in."],
  ["1d","Loses track partway through a task, like forgetting the next step in a multi-step math problem."],
  ["1c","Needs repeated reminders to do what they\u2019re supposed to do."]]],
 [2,"Sensing and managing time","Judging how long things take, and noticing time as it passes.",[
  ["2a","Chronically underestimates how long things take, or is shocked by how late it is when trying to complete a task."],
  ["2b","Says \u201cI have plenty of time,\u201d then panics right at the deadline."],
  ["2c","Loses whole afternoons or runs late without noticing the passage of time."]]],
 [3,"Getting started","Moving from \u201cI should do this\u201d to actually beginning the work.",[
  ["3a","Sits down to work but can\u2019t get started; the blank page wins."],
  ["3b","Doesn\u2019t want to sit down and puts off starting (not finishing); big projects sit untouched."],
  ["3c","Works fine once actually in motion, so the struggle is almost all at the beginning."]]],
 [4,"Sorting what matters most","Deciding what comes first, and mapping out the steps to get there.",[
  ["4a","Gets visibly overwhelmed by the sheer volume of work."],
  ["4b","Does the easy, low-stakes task while an important deadline is ignored."],
  ["4c","Can\u2019t say what matters most right now; everything feels equally urgent."]]],
 [5,"Keeping things organized","Papers, supplies, workspaces, and digital files: knowing where things live.",[
  ["5a","Loose papers get stuffed wherever they fit, so graded work and permission slips are hard to track down."],
  ["5b","Can\u2019t find what they need when they need it, like a worksheet, a charger, or a file on the computer."],
  ["5c","Their homework spot gets so cluttered that just getting set up eats into work time."]]],
 [6,"Staying with it","Keeping attention on a task long enough to finish it.",[
  ["6a","Drifts off partway through homework, even on work they know how to do."],
  ["6b","Gets pulled away easily by a phone, a sibling, a noise, or a new idea."],
  ["6c","Starts strong but leaves a trail of half-finished tasks."]]],
 [7,"Pausing before acting","Stopping to think before saying, doing, or turning something in.",[
  ["7a","Rushes through work to be done with it, skipping directions or making careless mistakes."],
  ["7b","Blurts things out or acts in the moment, then wishes they hadn\u2019t."],
  ["7c","Makes snap decisions they later regret, like picking a project topic in seconds or saying yes to plans without checking what\u2019s due."]]],
 [8,"Handling big feelings","Keeping frustration, worry, or disappointment from taking over the work.",[
  ["8a","A small setback, like a confusing problem or one low quiz grade, sets off a big reaction."],
  ["8b","Has a hard time hearing feedback or corrections on their work without getting defensive or upset."],
  ["8c","Takes a long time to settle back down after getting upset."]]],
 [9,"Rolling with changes","Adjusting when plans change or the first approach isn\u2019t working.",[
  ["9a","Gets thrown off by surprises in the school day, like a substitute, a moved due date, or a schedule switch."],
  ["9b","Has trouble switching gears from one subject or activity to the next, like going from math homework to reading."],
  ["9c","Gets frustrated when a group project means doing things someone else\u2019s way."]]],
 [10,"Sticking with a goal","Keeping effort going toward something that pays off later.",[
  ["10a","Talks excitedly about a goal, like raising a grade or making a team, but the effort fades within a week or two."],
  ["10b","Finds it hard to put in effort today for something that won\u2019t pay off for weeks."],
  ["10c","Gives up on longer projects when the finish line feels far away."]]],
 [11,"Stepping back to check","Looking back over work and noticing what is and isn\u2019t working.",[
  ["11a","Turns work in without looking it over first."],
  ["11b","Is genuinely surprised by grades, and thought the test or project went fine."],
  ["11c","Has trouble saying what went wrong, or what they\u2019d try differently next time."]]]
];
const ALLSTMT={};PARTS.forEach(p=>p[3].forEach(s=>ALLSTMT[s[0]]=s[1]));

const STEPS=[

  {id:"a_grade",t:"text",q:"Grade"},
  {id:"a_school",t:"text",q:"School"},
  {id:"a_you",t:"text",q:"Your first and last name"},
  {id:"a_rel",t:"single",q:"Your relationship to the student",o:["Mom","Dad","Grandparent","Guardian","Other"],other:"Other"},
  {id:"a_plat",t:"multi",q:"Online school platforms",hint:"Select which portal your school uses for grades and homework.",o:["Google Classroom","Canvas","Schoology","Other"],other:"Other"},
  {id:"a_plan",t:"single",q:"Does your child use a planner right now?",o:["Paper planner","An app or digital calendar","Not really"]},
  {id:"a_504",t:"single",q:"Any school supports in place, such as a 504 plan or IEP?",optional:1,o:["Yes","In progress","No","Not sure"]},
  {id:"a_learn",t:"long",q:"Anything else about how your child learns that would help us?",hint:"Such as an evaluation or diagnosis. Share only what you're comfortable with, this is entirely optional."},
  {id:"a_past",t:"long",q:"Has your child had tutoring, coaching, or other support before? If so, what helped and what didn't?"}
 ]},

const KEY="msm-parent-v1";
let st={i:0,a:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&typeof s.i==="number")st=s}catch(e){}
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function persist(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}

function renderTop(){
  const step=STEPS[st.i];
  $("#steps").innerHTML=SECTIONS.map(([k,l])=>{
    const idx=STEPS.map((s,i)=>s.sec===k?i:-1).filter(i=>i>=0);
    const first=idx[0],last=idx[idx.length-1];
    let pct=st.i>last?100:st.i<first?0:Math.round((st.i-first+1)/idx.length*100);
    if(step.kind==="done")pct=100;
    return `<div class="${step.sec===k?"on":""}"><div class="bar"><i style="width:${pct}%"></i></div><span>${l}</span></div>`}).join("");
  const rem=STEPS.slice(st.i).reduce((t,s)=>t+s.min,0);
  $("#left").textContent=step.kind==="done"?"All done":step.kind==="welcome"?"About 20 minutes":`About ${Math.max(1,Math.round(rem))} min left`;
  $("#back").style.visibility=st.i===0?"hidden":"visible";
  $("#saveBtn").hidden=step.kind==="welcome"||step.kind==="done";
  $("#next").textContent=step.kind==="welcome"?"Let's begin":step.kind==="done"?"Back to start":STEPS[st.i+1].kind==="done"?"Finish":"Next";
}

function chips(f){
  const v=st.a[f.id]; const multi=f.t==="multi"; const sel=multi?(v||[]):v;
  let h=`<div class="chips" role="group" aria-label="${esc(f.q)}">`+f.o.map(o=>{
    const on=multi?sel.includes(o):sel===o;
    return `<button type="button" class="chip" data-f="${f.id}" data-v="${esc(o)}" aria-pressed="${on}">${esc(o)}</button>`}).join("")+`</div>`;
  if(f.other&&(multi?sel.includes(f.other):sel===f.other))
    h+=`<input class="other" type="text" id="${f.id}_other" data-text="${f.id}_other" placeholder="Tell us more" value="${esc(st.a[f.id+"_other"])}">`;
  if(f.note&&f.note.when.includes(v))h+=`<p class="note" style="margin:10px 0 0">${esc(f.note.text)}</p>`;
  return h;
}
function field(f){
  const opt=f.optional?` <span class="opt">Optional</span>`:"";
  const hint=f.hint?`<p class="hint">${esc(f.hint)}</p>`:"";
  if(f.t==="text")return `<div class="q"><label class="ql" for="${f.id}">${esc(f.q)}${opt}</label>${hint}<input type="text" id="${f.id}" data-text="${f.id}" value="${esc(st.a[f.id])}"></div>`;
  if(f.t==="avail"){const sel=st.a[f.id]||[];const wk=["3 to 5 pm","5 to 7 pm","7 to 9 pm"],we=["Morning","Afternoon","Evening"];
    const row=(d,opts)=>`<span class="d">${d}</span>`+opts.map(o=>{const k=d+" "+o;return `<button type="button" data-av="${f.id}" data-v="${esc(k)}" aria-pressed="${sel.includes(k)}" aria-label="${esc(k)}">${o}</button>`}).join("");
    return `<div class="q"><span class="ql">${esc(f.q)}</span>${hint}<div class="avail"><span></span>${wk.map(w=>`<span class="h">${w}</span>`).join("")}${["Mon","Tue","Wed","Thu","Fri"].map(d=>row(d,wk)).join("")}<span></span>${we.map(w=>`<span class="h">${w}</span>`).join("")}${["Sat","Sun"].map(d=>row(d,we)).join("")}</div><p class="count">${sel.length} time${sel.length===1?"":"s"} picked</p></div>`;}
  if(f.t==="grades"){const rows=(st.a[f.id]&&st.a[f.id].length)?st.a[f.id]:[{c:"",g:""}];
    return `<div class="q"><span class="ql">${esc(f.q)}</span>${hint}<div class="grows">`+rows.map((r,i)=>`<div class="grow"><input type="text" id="${f.id}_c${i}" data-gr="${f.id}|${i}|c" placeholder="Class" aria-label="Class ${i+1}" value="${esc(r.c)}"><input type="text" id="${f.id}_g${i}" data-gr="${f.id}|${i}|g" placeholder="Grade" aria-label="Grade ${i+1}" value="${esc(r.g)}">${rows.length>1?`<button type="button" class="x" data-delrow="${f.id}|${i}" aria-label="Remove class ${i+1}">\u00d7</button>`:"<span></span>"}</div>`).join("")+(rows.length<6?`<button type="button" class="addrow" data-addrow="${f.id}">+ Add another class</button>`:"")+`</div></div>`;}
  if(f.t==="long")return `<div class="q"><label class="ql" for="${f.id}">${esc(f.q)}${opt}</label>${hint}<textarea id="${f.id}" data-text="${f.id}">${esc(st.a[f.id])}</textarea></div>`;
  return `<div class="q"><span class="ql">${esc(f.q)}${opt}</span>${hint}${chips(f)}</div>`;
}

function render(){
  const s=STEPS[st.i]; let h="";
  if(s.kind==="welcome"){
    h=`<section class="card"><p class="eyebrow">Family intake</p><h1>Getting to know your student</h1>
    <p class="lede">Please provide a little background on your student. Every Simplifi EDU plan is personalized to fit your child. This snapshot helps us start in the right place and focus on what is actually getting in the way day to day.</p>
    <div class="stack">
      <p class="lede" style="margin:0">This snapshot covers six short sections: background, everyday habits, strengths, how school is going, homework at home, and your goals, plus your availability. Most kids have a mix of things that come easily and things that take more effort, so expect to see both.</p>
      <div class="note"><b>A few quick tips.</b> Answer based on what you've observed with your child over the last month or so, and go with your first instinct. If a statement doesn't fit your child at all, pick Rarely and move on. You can save and come back anytime.</div>
    </div></section>`;
  } else if(s.kind==="part"){
    const [n,t,sub,items]=s.part;
    const done=items.filter(x=>st.a[x[0]]).length;
    h=`<section class="card"><p class="eyebrow">Everyday patterns \u00b7 ${n} of 11</p><h2>${esc(t)}</h2><p class="lede">${esc(sub)}</p>
    <p class="hint" style="margin-top:6px">How often does this sound like your child?</p>
    <div class="stack">`+items.map(([id,txt])=>`<div class="stmt"><p>${esc(txt)}</p>
      <div class="scale" role="group" aria-label="How often: ${id}">${SCALE.map((l,k)=>`<button type="button" data-r="${id}" data-v="${k+1}" aria-pressed="${st.a[id]===k+1}">${l}</button>`).join("")}</div></div>`).join("")+
    `</div><p class="count">${done} of ${items.length} answered</p></section>`;
  } else if(s.kind==="top3"){
    let pool=Object.keys(ALLSTMT).filter(k=>(st.a[k]||0)>=3);
    const showAll=pool.length<3; if(showAll)pool=Object.keys(ALLSTMT);
    const picks=st.a.top3||[];
    h=`<section class="card"><p class="eyebrow">Everyday patterns \u00b7 Your top three</p><h2>Which three feel most true this week?</h2>
    <p class="lede">${showAll?"Tap three statements, starting with the one that feels most true.":"Here are the statements you marked Often or Almost always. Tap three, starting with the one that feels most true."}</p>
    <div class="picks" style="margin-top:18px">`+pool.map(k=>{const p=picks.indexOf(k);return `<button type="button" class="pickrow" data-pick="${k}" aria-pressed="${p>=0}"><span class="badge">${p>=0?p+1:""}</span><span>${esc(ALLSTMT[k])}</span></button>`}).join("")+`</div></section>`;
  } else if(s.kind==="done"){
    h=`<section class="card"><p class="eyebrow">All done</p><h1>Thank you. That\u2019s everything.</h1>
<p class="lede">Our team reviews this with you and builds a plan tailored to your child. This snapshot is only a starting point for the conversation, never a label, and the plan will keep evolving as we learn what genuinely helps.</p>
<p class="hint" style="margin-top:14px">Our coaching approach draws on the executive skills research of Peg Dawson and Richard Guare. This snapshot was written by Simplifi EDU.</p>
<div class="note" style="margin-top:16px"><span>${esc(sendMsg||"Your answers have been saved.")}</span></div></section>`;
  } else {
    h=`<section class="card"><p class="eyebrow">Section ${s.sec}</p><h2>${esc(s.title)}</h2><p class="lede">${esc(s.lede)}</p><div class="stack">${s.fields.map(field).join("")}</div></section>`;
  }
  $("#screen").innerHTML=h; renderTop();
}

document.addEventListener("click",e=>{
  const c=e.target.closest(".chip");
  if(c){const f=findField(c.dataset.f),v=c.dataset.v;
    if(f.t==="multi"){let a=st.a[f.id]||[];if(a.includes(v))a=a.filter(x=>x!==v);else{if(f.max&&a.length>=f.max)a=a.slice(1);a=[...a,v]}st.a[f.id]=a}
    else st.a[f.id]=st.a[f.id]===v?undefined:v;
    persist();render();focusSame(`.chip[data-f="${f.id}"][data-v="${CSS.escape(v)}"]`);return}
  const r=e.target.closest("[data-r]");
  if(r){const id=r.dataset.r;st.a[id]=+r.dataset.v;persist();render();
    const next=document.querySelector(".stmt:has(.scale button[aria-pressed=true]) ~ .stmt:not(:has(button[aria-pressed=true]))");
    focusSame(`[data-r="${id}"][data-v="${r.dataset.v}"]`);
    if(next&&window.matchMedia("(max-width:700px)").matches)next.scrollIntoView({behavior:"smooth",block:"center"});return}
  const p=e.target.closest("[data-pick]");
  if(p){let a=st.a.top3||[];const k=p.dataset.pick;if(a.includes(k))a=a.filter(x=>x!==k);else if(a.length<3)a=[...a,k];st.a.top3=a;persist();render();focusSame(`[data-pick="${k}"]`);return}
});
document.addEventListener("input",e=>{const k=e.target.dataset.text;if(k){st.a[k]=e.target.value;persist();return}
  const gr=e.target.dataset.gr;if(gr){const [id,i,c]=gr.split("|");const rows=(st.a[id]&&st.a[id].length)?st.a[id]:[{c:"",g:""}];rows[+i][c]=e.target.value;st.a[id]=rows;persist()}});
document.addEventListener("click",e=>{const b=e.target.closest("[data-av]");if(!b)return;const id=b.dataset.av,v=b.dataset.v;let arr=st.a[id]||[];arr=arr.includes(v)?arr.filter(x=>x!==v):[...arr,v];st.a[id]=arr;persist();render();const n=document.querySelector(`[data-av="${id}"][data-v="${CSS.escape(v)}"]`);if(n)n.focus({preventScroll:true});});
document.addEventListener("click",e=>{const a=e.target.closest("[data-addrow]");const d=e.target.closest("[data-delrow]");
  if(a){const id=a.dataset.addrow;const rows=(st.a[id]&&st.a[id].length)?st.a[id]:[{c:"",g:""}];rows.push({c:"",g:""});st.a[id]=rows;persist();render();const n=document.getElementById(id+"_c"+(rows.length-1));if(n)n.focus();}
  if(d){const [id,i]=d.dataset.delrow.split("|");st.a[id].splice(+i,1);persist();render();}});
function focusSame(sel){const el=document.querySelector(sel);if(el)el.focus({preventScroll:true})}
function findField(id){for(const s of STEPS)for(const f of (s.fields||[]))if(f.id===id)return f}
function go(d){st.i=Math.min(STEPS.length-1,Math.max(0,st.i+d));persist();render();window.scrollTo({top:0})}
$("#next").onclick=()=>{if(STEPS[st.i].kind==="done"){st.i=0;sendMsg="";persist();render();window.scrollTo({top:0})}else{const fin=STEPS[st.i+1].kind==="done";go(1);if(fin)submitResults()}};
let sendMsg="";const FORM="parent";
async function submitResults(){
  sendMsg="Saving your answers...";render();
  try{
    const res = await fetch("/api/submit", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({form: FORM, answers: JSON.parse(JSON.stringify(st.a))})
    });
    if(!res.ok) throw new Error("Failed");
    sendMsg="Saved! Thank you for completing the intake.";
  } catch(e){
    sendMsg="Something went wrong saving your answers. Please try again or contact your Simplifi coordinator.";
  }
  render();
}
$("#back").onclick=()=>go(-1);
$("#saveBtn").onclick=()=>{persist();$("#toast").textContent="Saved. Come back anytime.";setTimeout(()=>$("#toast").textContent="",2600)};
render();
</script>

</body></html>
